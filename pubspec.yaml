name: liquid_tab_bar
description: Two iOS 26-style floating liquid-glass tab bars for Flutter with spring-driven lenses, refraction, search, actions, badges, and scroll-aware folding.
version: 2.0.0
repository: https://github.com/ahmedmarwan47-stack/liquid_tab_bar
issue_tracker: https://github.com/ahmedmarwan47-stack/liquid_tab_bar/issues
topics:
  - navigation
  - tabs
  - glassmorphism
  - ios
  - ui

environment:
  sdk: ^3.6.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  shaders:
    # The default bar.
    - assets/shaders/nav_glass.frag
    # The droplet variant's own pair.
    - assets/shaders/droplet/nav_glass.frag
    - assets/shaders/droplet/droplet_glass.frag
